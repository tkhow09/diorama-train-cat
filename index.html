<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* day sky: soft vignette, near-white in the middle fading to a pale sky blue at the edges */
  body {
    background: radial-gradient(ellipse at center, #ffffff 0%, #f5fafd 35%, #e2f1fa 70%, #cde6f6 100%);
    font: 13px/1.4 system-ui, sans-serif;
  }
  canvas { display: block; position: relative; z-index: 1; }
  /* Mr. Quincy (1001Fonts, free for personal use) */
  @font-face {
    font-family: 'Mr Quincy';
    src: url('fonts/MrQuincy-Regular.otf') format('opentype');
    font-display: swap;
  }
  /* title, top left; its colour follows day/night (--title-color is set from the script) */
  #title {
    position: fixed; left: 28px; top: 30px; z-index: 2; margin: 0; pointer-events: none;
    font: normal 72px/1 'Mr Quincy', system-ui, sans-serif;
    letter-spacing: 0.02em;
    color: var(--title-color, #1e2b38);
    transition: opacity .6s ease;
  }
  body.pov #title { opacity: 0; }   /* fades out while riding in the train */
  /* phones: bigger, on two rows ("DIORAMA" / "TRAIN CAT"), clear of the toggles on the right */
  @media (max-width: 600px) {
    #title { left: 16px; top: 24px; font-size: 56px; line-height: 1.08; }
    #title .row { display: block; }
  }
  /* night sky fades in over the day gradient; opacity is driven from the script */
  #nightSky {
    position: fixed; inset: 0; z-index: 0; opacity: 0; pointer-events: none;
    /* same vignette at night: a lighter navy glow in the middle deepening to near-black blue at the edges */
    background: radial-gradient(ellipse at center, #2b4568 0%, #1c3152 35%, #0f1f3b 70%, #060d1f 100%);
  }
  /* starfield drawn by the script, layered over the night gradient */
  #stars { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* MODE / MUSIC / SFX toggles, top right: the toggle-on/off artwork (pill + rounded-square knob) scaled
     from 76x33, with the state icon on the side opposite the knob. Colours follow day/night. */
  #toggles {
    position: fixed; right: 28px; top: 30px; z-index: 2;   /* same top as the title; above the canvas */
    display: grid; grid-template-columns: auto auto; align-items: center; gap: 16px 14px;
  }
  .tlabel {
    font: normal 28px/1 'Mr Quincy', system-ui, sans-serif; letter-spacing: .04em;
    color: var(--title-color, #1e2b38); text-align: right; user-select: none;
  }
  .toggle {
    position: relative; width: 70px; height: 30px; padding: 0; cursor: pointer;
    border: 1px solid currentColor; border-radius: 9px;
    background: var(--icon-bg, #fff); color: var(--icon-color, #4d4d4d);
  }
  .toggle:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  .toggle .knob {
    position: absolute; top: 5px; left: 7px; width: 18px; height: 18px; border-radius: 5px;
    background: currentColor; transition: transform .25s ease;
  }
  .toggle.right .knob { transform: translateX(36px); }
  .toggle .ticon {
    position: absolute; top: 5px; right: 7px; width: 18px; height: 18px; transition: opacity .2s ease;
  }
  .toggle.right .ticon { right: auto; left: 7px; }
  .toggle .ticon svg { width: 100%; height: 100%; display: block; }
  /* phones: top edge level with the title's letters (title box at 24px, its capitals start ~2px lower) */
  @media (max-width: 600px) { #toggles { right: 16px; top: 26px; } }
  /* icon controls, centred at the bottom; icon colour follows day/night (--icon-color, set from the script) */
  #controls {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); z-index: 2;
    display: flex; gap: 18px;
  }
  @media (max-width: 600px) { #controls { bottom: 56px; } }
  #controls button {
    width: 52px; height: 52px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
    background: transparent; color: var(--icon-color, #4d4d4d);
    transition: transform .15s ease, opacity .15s ease; opacity: .9;
  }
  #controls button:hover { transform: scale(1.08); opacity: 1; }
  #controls button:active { transform: scale(0.96); }
  #controls button:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
  #controls svg { width: 100%; height: 100%; display: block; }
  /* loading screen: four paw prints always on screen in a staggered trail; a dark step walks across
     them, so the two newest are dark and the older two light grey, like the reference. Covers the
     page until the diorama is ready, then fades away */
  #loading {
    position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; justify-items: center;
    gap: 26px; color: #1e2b38;
    background: radial-gradient(ellipse at center, #ffffff 0%, #f5fafd 35%, #e2f1fa 70%, #cde6f6 100%);
    transition: opacity .8s ease, visibility .8s;
  }
  #loading.done { opacity: 0; visibility: hidden; }
  #paws { position: relative; width: 210px; height: 52px; }
  #paws svg {
    position: absolute; width: 26px; height: 26px; color: #c3cad1;
    animation: pawstep 1.2s linear infinite;   /* 4 steps x 0.3 s: one step lands every 0.3 s */
  }
  /* alternate left (low) and right (high) feet, toes pointing the way they walk */
  #paws svg:nth-child(1) { left: 0;     top: 24px; rotate: 72deg;  animation-delay: 0s; }
  #paws svg:nth-child(2) { left: 56px;  top: 2px;  rotate: 82deg;  animation-delay: .3s; }
  #paws svg:nth-child(3) { left: 112px; top: 24px; rotate: 72deg;  animation-delay: .6s; }
  #paws svg:nth-child(4) { left: 168px; top: 2px;  rotate: 82deg;  animation-delay: .9s; }
  /* each paw: stamped dark, stays dark while the next step lands, then settles back to light grey */
  @keyframes pawstep {
    0%   { color: #1e2b38; transform: scale(1.2); }
    6%   { color: #1e2b38; transform: scale(1); }   /* stamp */
    40%  { color: #1e2b38; }   /* dark for two steps (0.6 s), so two paws are dark at any moment */
    50%  { color: #c3cad1; }
    100% { color: #c3cad1; }
  }
  #loadingLabel { font: normal 30px/1 'Mr Quincy', system-ui, sans-serif; letter-spacing: .06em; }
  /* loaded, but the browser blocked sound until a click: the label turns into the way in */
  #loading.ask { cursor: pointer; }
  #loading.ask #loadingLabel { animation: askpulse 1.6s ease-in-out infinite; }
  @keyframes askpulse { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) {
    #paws svg { animation: none; }
    #paws svg:nth-child(n+3) { color: #1e2b38; }
  }
</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));   // 2x on retina costs ~1.8x the pixels for little visible gain
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);           // transparent so the CSS gradient shows
renderer.toneMapping = THREE.NeutralToneMapping;   // keeps the low-poly colours saturated
renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x6b5a45, 0.35);  // soft sky fill to match the background
scene.add(hemi);
// neutral studio reflections so metal parts (bridges, tower) keep their colour
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.2;   // kept low so the sun's shadows stay readable

// long lens: keeps the board's edges parallel instead of splaying like a wide angle
const orbitCam = new THREE.PerspectiveCamera(15, innerWidth / innerHeight, 0.1, 500);
const controls = new OrbitControls(orbitCam, renderer.domElement);
controls.enableDamping = true;
// Showcase turntable: the view circles the board very slowly, like a product on a stand. It rests
// while you drag or zoom and picks up again a few seconds after you let go; pause stops it too.
const SPIN_SPEED = 0.5;      // OrbitControls units: 2.0 is one turn per 30 s, so 0.5 is one per 2 minutes
const SPIN_RESUME = 3;       // seconds after the last touch before it starts turning again
let spinHold = 0, entered = false;   // the turntable waits until the loading screen has lifted
controls.autoRotateSpeed = SPIN_SPEED;
controls.addEventListener('start', () => { spinHold = Infinity; });
controls.addEventListener('end', () => { spinHold = SPIN_RESUME; });
const panBounds = new THREE.Box3();   // set once the board loads; keeps the view centre over the board
const SWIPE_MARGIN = 0.65;   // sky left beside the board's end when a swipe reaches it (world units)

// Trackpad: a mostly-horizontal two-finger swipe slides the view left/right along the board;
// vertical swipes and pinches still reach OrbitControls and zoom. Capture phase so this runs first.
renderer.domElement.addEventListener('wheel', (e) => {
  // in the cab, a two-finger swipe looks around instead (grab-style, like a panorama)
  if (lookActive()) {
    e.preventDefault();
    e.stopImmediatePropagation();
    if (!e.ctrlKey) turnLook(-e.deltaX * LOOK_SWIPE, -e.deltaY * LOOK_SWIPE);
    return;
  }
  if (!controls.enabled || e.ctrlKey || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  e.preventDefault();
  e.stopImmediatePropagation();
  spinHold = SPIN_RESUME;
  // pixels -> world units at the pivot's depth, so the board tracks the fingers at any zoom
  const depth = orbitCam.position.distanceTo(controls.target);
  const perPx = (2 * depth * Math.tan(THREE.MathUtils.degToRad(orbitCam.fov) / 2)) / renderer.domElement.clientHeight;
  const right = new THREE.Vector3().setFromMatrixColumn(orbitCam.matrixWorld, 0);
  right.y = 0; right.normalize();   // slide along the board, not up into the sky
  const move = right.multiplyScalar(e.deltaX * perPx);
  // stop when the board's end reaches the screen edge (plus a small margin), not when the view centre
  // does; that would leave half a screen of empty sky. If the whole board fits, keep it centred.
  if (!panBounds.isEmpty()) {
    const halfView = (perPx * renderer.domElement.clientWidth) / 2;
    const lo = panBounds.min.x + halfView - SWIPE_MARGIN, hi = panBounds.max.x - halfView + SWIPE_MARGIN;
    const x = controls.target.x + move.x;
    const clampedX = lo > hi ? (panBounds.min.x + panBounds.max.x) / 2 : THREE.MathUtils.clamp(x, lo, hi);
    move.multiplyScalar(move.x ? (clampedX - controls.target.x) / move.x : 0);
  }
  controls.target.add(move);
  orbitCam.position.add(move);
  controls.update();
}, { passive: false, capture: true });

const REMOVE = [
  'Tree_0294',   // pine at the river's left bank, blocking the front bridge
  // Blender's own tower beacon: the page draws its own blinking one in the same spot (addBeacon)
  'Tower_Beacon', 'Tower_Beacon_Halo', 'Tower_Beacon_Light',
];

// Trees nudged clear of poles that pierced their foliage (world x/z offsets)
const MOVE = {
  Tree_0219: [-0.045, -0.014],     // overhead-wire mast Pole_10 went 35 mm into it
  TownTree_017: [0.024, -0.006],   // a station post went 14 mm into it
};

// Bonfire_Light's flicker is a driver on its energy in Blender, which glTF can't carry: same formula here
const FIRE_INTENSITY = 0.05;   // three.js intensity per Blender watt
let fireLight = null;
const flames = [];
function updateFire(frame) {
  if (!fireLight) return;
  const f = frame * 0.45;
  const watts = 3 + 0.8 * Math.sin(f * 0.7) + 0.5 * Math.sin(f * 1.9 + 1) + 0.3 * Math.sin(f * 3.7);
  fireLight.intensity = watts * FIRE_INTENSITY * night;   // only burns at night
}

let mixer, povCam, usePov = false, playing = true;
let beacon = null, sunLight = null;
const lamps = { lights: [], glass: new Set() };
const windows = [];   // glass that glows warm at night: cabin, town houses, the big brick building
const WINDOW_MATERIALS = ['mat_window', 'window', 'DarkGrey.001'];

// Day / night. `night` eases between 0 (day) and 1 (night); every mode-dependent light reads it.
const DAY = { sun: new THREE.Color(0xfff1dc), sunI: 3.2, sky: new THREE.Color(0xbfe3ff), ground: new THREE.Color(0x6b5a45),
              hemiI: 0.35, env: 0.2 };
const NIGHT = { sun: new THREE.Color(0x9db4ff), sunI: 0.45, sky: new THREE.Color(0x2c3f6b), ground: new THREE.Color(0x15151c),
                hemiI: 0.18, env: 0.04 };
const LAMP_NIGHT_BOOST = 0.9, WINDOW_GLOW = 2.2, RIVER_NIGHT = 0.28, MODE_SECONDS = 1.5;
let night = 0, nightTarget = 0;
const riverBright = { value: 1 };
const nightSkyEl = document.getElementById('nightSky');
const TITLE_DAY = new THREE.Color(0x1e2b38), TITLE_NIGHT = new THREE.Color(0xe6eef8);
const ICON_DAY = new THREE.Color(0x4d4d4d), ICON_NIGHT = new THREE.Color(0xdde6f2);
const ICON_BG_DAY = new THREE.Color(0xffffff), ICON_BG_NIGHT = new THREE.Color(0x1c3152);

// Night starfield: a seeded scatter laid out to the window size (rebuilt on resize so it stays
// crisp), denser toward the top; a few brighter stars get a soft halo. Each star twinkles on its
// own speed and phase; the canvas is only redrawn while the night sky is showing.
const STAR_COUNT = 300, STAR_FPS = 30;
const starfield = { stars: [], ctx: null, last: -1 };
function layoutStars() {
  const c = document.getElementById('stars'), dpr = Math.min(devicePixelRatio, 2);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  starfield.ctx = c.getContext('2d');
  starfield.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  let seed = 11;
  const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
  starfield.stars = [...Array(STAR_COUNT)].map(() => {
    const big = rand() < 0.08;
    return {
      x: rand() * innerWidth, y: Math.pow(rand(), 1.6) * innerHeight,   // bias toward the top
      big, r: big ? 1.2 + rand() * 0.8 : 0.55 + rand() * 0.75,
      a: big ? 0.95 : 0.5 + rand() * 0.45,
      tint: rand() < 0.2 ? '210,225,255' : rand() < 0.1 ? '255,240,215' : '255,255,255',
      speed: 0.8 + rand() * 2.6, phase: rand() * Math.PI * 2,
      depth: rand() < 0.3 ? 0.75 : 0.35,   // how deep its twinkle dips: some shimmer strongly
    };
  });
  starfield.last = -1;
  drawStars(0, true);
}
function drawStars(t, force = false) {
  if (!starfield.ctx || (!force && night < 0.01)) return;
  if (!force && t - starfield.last < 1 / STAR_FPS) return;
  starfield.last = t;
  const g = starfield.ctx;
  g.clearRect(0, 0, innerWidth, innerHeight);
  for (const s of starfield.stars) {
    const tw = 1 - s.depth * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase));   // 1 = full brightness
    if (s.big) {   // soft halo
      const h = g.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 4);
      h.addColorStop(0, `rgba(${s.tint},${0.35 * tw})`); h.addColorStop(1, `rgba(${s.tint},0)`);
      g.fillStyle = h; g.beginPath(); g.arc(s.x, s.y, s.r * 4, 0, Math.PI * 2); g.fill();
    }
    g.fillStyle = `rgba(${s.tint},${s.a * tw})`;
    g.beginPath(); g.arc(s.x, s.y, s.r, 0, Math.PI * 2); g.fill();
  }
}
layoutStars();
addEventListener('resize', layoutStars);

function applyMode(k) {
  if (sunLight) {
    sunLight.color.lerpColors(DAY.sun, NIGHT.sun, k);
    sunLight.intensity = THREE.MathUtils.lerp(DAY.sunI, NIGHT.sunI, k);
  }
  hemi.color.lerpColors(DAY.sky, NIGHT.sky, k);
  hemi.groundColor.lerpColors(DAY.ground, NIGHT.ground, k);
  hemi.intensity = THREE.MathUtils.lerp(DAY.hemiI, NIGHT.hemiI, k);
  scene.environmentIntensity = THREE.MathUtils.lerp(DAY.env, NIGHT.env, k);
  nightSkyEl.style.opacity = k;
  // title swaps from dark ink on the day sky to pale on the night sky
  document.documentElement.style.setProperty('--title-color', '#' + TITLE_DAY.clone().lerp(TITLE_NIGHT, k).getHexString());
  document.documentElement.style.setProperty('--icon-color', '#' + ICON_DAY.clone().lerp(ICON_NIGHT, k).getHexString());
  document.documentElement.style.setProperty('--icon-bg', '#' + ICON_BG_DAY.clone().lerp(ICON_BG_NIGHT, k).getHexString());
  // lights stay in the scene at intensity 0 by day, so switching never triggers a shader recompile
  for (const l of lamps.lights) l.intensity = l.userData.onIntensity * LAMP_NIGHT_BOOST * k;
  for (const m of lamps.glass) m.emissiveIntensity = m.userData.onIntensity * k;
  for (const m of windows) m.emissiveIntensity = WINDOW_GLOW * k;
  for (const f of flames) f.visible = k > 0.35;
  updateStationLights(k);
  shopGlow.value = SHOP_GLOW * k;
  if (train.windowMat) train.windowMat.emissiveIntensity = TRAIN_GLOW * k;
  if (train.light) train.light.intensity = TRAIN_LIGHT * k;
  if (train.lampMat) train.lampMat.emissiveIntensity = THREE.MathUtils.lerp(HEADLAMP.glow[0], HEADLAMP.glow[1], k);
  if (train.beam) train.beam.intensity = THREE.MathUtils.lerp(HEADLAMP.beam[0], HEADLAMP.beam[1], k);
  riverBright.value = THREE.MathUtils.lerp(1, RIVER_NIGHT, k);
}

// Fluorescent tubes hung under both station canopies. Each platform has two rows of pink pillars
// with a slatted wall between them; the tubes go just on the track side of the inner row (out over
// the open platform), in the middle of each gap between neighbouring pillars, hanging just under
// the roof, so they never touch a pillar, its T-shaped top or the wall. Off by day; at night they
// flicker on while the mode fades in, then hold steady.
const TUBE_LEN = 0.04, TUBE_Y = 0.252, TUBE_GLOW = 3, TUBE_LIGHT = 0.12;
const TUBE_OUT = 0.016;   // how far out from the inner pillar row, toward the track
const TUBE_HANG = 0.014;  // how far the fittings hang below the roof on their wires
const station = { tubeMat: null, lights: [], platforms: [] };

// pink pillars (thin vertical pieces rising from the platform decks), grouped per platform
function findPlatforms(stationGroup) {
  const posts = [];
  stationGroup.traverse((m) => {
    if (!m.isMesh) return;
    const b = new THREE.Box3().setFromObject(m), s = b.getSize(new THREE.Vector3());
    if (s.y > 0.04 && s.x < 0.02 && s.z < 0.02 && b.min.y < 0.2) posts.push(b.getCenter(new THREE.Vector3()));
  });
  const platforms = [];
  for (const p of posts) {
    let pl = platforms.find((q) => Math.abs(q.zMid - p.z) < 0.08);
    if (!pl) platforms.push(pl = { zMid: p.z, posts: [] });
    pl.posts.push(p);
    pl.zMid = pl.posts.reduce((s, q) => s + q.z, 0) / pl.posts.length;   // midway between its two rows
  }
  // the track runs between the platforms; each platform's inner pillar row is the one facing it
  const trackZ = platforms.reduce((s, p) => s + p.zMid, 0) / platforms.length;
  for (const pl of platforms) {
    const xs = [...new Set(pl.posts.map((p) => +p.x.toFixed(3)))].sort((a, b) => a - b);
    pl.tubeXs = xs.slice(1).map((x, i) => (x + xs[i]) / 2);   // middle of each gap between pillars
    const rows = [...new Set(pl.posts.map((p) => +p.z.toFixed(3)))];
    const inner = rows.reduce((a, b) => (Math.abs(b - trackZ) < Math.abs(a - trackZ) ? b : a));
    pl.tubeZ = inner + Math.sign(trackZ - inner) * TUBE_OUT;
  }
  return platforms;
}

// Cast rays straight up along a tube's length and return the lowest structure above it (rafters or
// roof boards), so the tube can hang just under it.
function ceilingAbove(stationGroup, x, z, halfLen) {
  const rc = new THREE.Raycaster();
  const up = new THREE.Vector3(0, 1, 0);
  let ceiling = Infinity;
  for (let i = 0; i <= 6; i++) {
    for (const dz of [-0.004, 0, 0.004]) {
      rc.set(new THREE.Vector3(x - halfLen + (2 * halfLen * i) / 6, 0.2, z + dz), up);
      rc.far = 0.2;
      const hit = rc.intersectObject(stationGroup, true)[0];
      if (hit) ceiling = Math.min(ceiling, hit.point.y);
    }
  }
  return ceiling;
}

function addStationLights(stationGroup) {
  if (!stationGroup) return;
  station.tubeMat = new THREE.MeshStandardMaterial({ color: 0xf4f8ff, emissive: 0xe6f2ff, emissiveIntensity: 0 });
  const tubeGeo = new THREE.CylinderGeometry(0.0022, 0.0022, TUBE_LEN, 8).rotateZ(Math.PI / 2);
  const housingGeo = new THREE.BoxGeometry(TUBE_LEN + 0.005, 0.003, 0.008);
  const housingMat = new THREE.MeshStandardMaterial({ color: 0x3b3f44, roughness: 0.7 });
  stationGroup.updateMatrixWorld(true);
  station.platforms = findPlatforms(stationGroup);
  const wireGeo = new THREE.CylinderGeometry(0.0004, 0.0004, 1, 5);   // unit height, scaled per wire
  const wireMat = new THREE.MeshStandardMaterial({ color: 0x23262a, roughness: 0.8 });
  const wireRay = new THREE.Raycaster(), UP = new THREE.Vector3(0, 1, 0);
  wireRay.far = 0.1;
  for (const pl of station.platforms) {
    const z = pl.tubeZ, half = (TUBE_LEN + 0.005) / 2;
    // one tidy row per platform: all fittings hang the same drop below the lowest structure above any
    // of them, on two wires each, like suspended lamps
    const ceiling = Math.min(...pl.tubeXs.map((x) => ceilingAbove(stationGroup, x, z, half)));
    const housingTop = Math.min(TUBE_Y + 0.005, ceiling - 0.0005) - TUBE_HANG;
    pl.tubeY = housingTop - 0.0052;
    for (const x of pl.tubeXs) {
      const tube = new THREE.Mesh(tubeGeo, station.tubeMat);
      const housing = new THREE.Mesh(housingGeo, housingMat);
      housing.position.set(x, housingTop - 0.0015, z);
      tube.position.set(x, pl.tubeY, z);
      tube.castShadow = housing.castShadow = false;
      scene.add(tube, housing);
      // two wires near the fitting's ends, each running up to the roof surface right above it
      for (const wx of [x - TUBE_LEN * 0.35, x + TUBE_LEN * 0.35]) {
        // straight up from the fitting at the wire's exact spot, so it meets the surface right above it
        wireRay.set(new THREE.Vector3(wx, housingTop + 0.0005, z), UP);
        const hit = wireRay.intersectObject(stationGroup, true)[0];
        const top = hit ? hit.point.y : Infinity;
        const len = (isFinite(top) ? top : housingTop + TUBE_HANG) - housingTop;
        const wire = new THREE.Mesh(wireGeo, wireMat);
        wire.scale.y = len;
        wire.position.set(wx, housingTop + len / 2, z);
        wire.castShadow = false;
        scene.add(wire);
      }
    }
    // a few cool-white lights along each platform rather than one per tube, to keep the light count low
    const xs = pl.tubeXs;
    for (const x of [xs[0], xs[Math.floor(xs.length / 2)], xs[xs.length - 1]]) {
      const l = new THREE.PointLight(0xdcecff, 0, 0.22, 2);
      l.position.set(x, pl.tubeY - 0.02, z);
      scene.add(l); station.lights.push(l);
    }
  }
}
function updateStationLights(k) {
  if (!station.tubeMat) return;
  // fluorescent start-up: stutter while switching on, steady once fully night
  const warming = nightTarget === 1 && k < 1;
  const flick = warming ? (Math.random() < 0.35 ? 0.15 : 1) : 1;
  station.tubeMat.emissiveIntensity = TUBE_GLOW * k * flick;
  for (const l of station.lights) l.intensity = TUBE_LIGHT * k * flick;
}

// Low-poly day clouds: clusters of flat-shaded, squashed icosahedrons scattered over the board itself,
// higher than the radio tower's tip (~1.8). They drift along the board and wrap back within its
// length. A fixed seed keeps the same sky on every load.
const CLOUD_SPEED = 0.05;   // drift in world units/s
const CLOUD_X = [-3.6, 3.6];   // the board's length: clouds drift across it and wrap at the ends
// Spread evenly without rows or columns: every cloud gets its own slot along the board, and its depth
// steps by the golden ratio (a low-discrepancy sequence), so neighbours along the board always land
// at very different depths. From the camera that reads as an even, natural scatter.
const CLOUD_COUNT = 13;
const CLOUD_Z = [-1.25, 1.15], CLOUD_Y = [1.55, 1.75];   // depth across the board; height: just under the tower tip (~1.8)
const clouds = { group: new THREE.Group(), mat: null };
// colour and glow by day and by night: at night they stay, a soft moonlit grey-blue
const CLOUD_DAY = { color: new THREE.Color(0xffffff), emissive: new THREE.Color(0xdfeaf5) };
const CLOUD_NIGHT = { color: new THREE.Color(0xdde3f0), emissive: new THREE.Color(0x7a87a8) };
function addClouds() {
  let seed = 7;
  const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
  clouds.mat = new THREE.MeshStandardMaterial({
    color: 0xffffff, emissive: 0xdfeaf5, emissiveIntensity: 0.35, roughness: 1, flatShading: true, transparent: true });
  const puffGeo = new THREE.IcosahedronGeometry(1, 0);
  const between = ([a, b]) => a + rand() * (b - a);
  for (let i = 0; i < CLOUD_COUNT; i++) {
    const cloud = new THREE.Group();
    const puffs = 4 + Math.floor(rand() * 3);
    for (let p = 0; p < puffs; p++) {
      const puff = new THREE.Mesh(puffGeo, clouds.mat);
      const s = 0.12 + rand() * 0.16;
      puff.scale.set(s * (1.1 + rand() * 0.4), s * (0.55 + rand() * 0.2), s);
      // spread along the cloud's length, bigger puffs toward the middle
      const t = puffs === 1 ? 0 : p / (puffs - 1) - 0.5;
      puff.position.set(t * 0.55 + (rand() - 0.5) * 0.08, (0.5 - Math.abs(t)) * 0.08, (rand() - 0.5) * 0.12);
      puff.rotation.set(rand() * 3, rand() * 3, rand() * 3);
      puff.castShadow = puff.receiveShadow = false;
      cloud.add(puff);
    }
    const size = 0.55 + rand() * 0.45;
    cloud.scale.setScalar(size);
    const u = (i + 0.5 + (rand() - 0.5) * 0.5) / CLOUD_COUNT;              // own slot along the board
    const v = (0.5 + i * 0.6180339887 + (rand() - 0.5) * 0.12) % 1;         // golden-ratio depth
    const lerp = (r, t) => r[0] + (r[1] - r[0]) * t;
    cloud.position.set(lerp(CLOUD_X, u), between(CLOUD_Y), lerp(CLOUD_Z, (v + 1) % 1));
    cloud.userData = { drift: true, baseY: cloud.position.y, phase: rand() * Math.PI * 2 };
    clouds.group.add(cloud);
  }
  scene.add(clouds.group);
}
function updateClouds(dt, k) {
  if (!clouds.mat) return;
  clouds.mat.color.lerpColors(CLOUD_DAY.color, CLOUD_NIGHT.color, k);   // darken with night
  clouds.mat.emissive.lerpColors(CLOUD_DAY.emissive, CLOUD_NIGHT.emissive, k);
  if (!playing) return;
  clouds.time = (clouds.time || 0) + dt;
  for (const c of clouds.group.children) {
    if (c.userData.drift) {
      c.position.x += CLOUD_SPEED * dt * (0.8 + c.scale.x * 0.3);   // bigger clouds drift a bit faster
      if (c.position.x > CLOUD_X[1]) c.position.x -= CLOUD_X[1] - CLOUD_X[0];
    } else {
      c.position.y = c.userData.baseY + Math.sin(clouds.time * 0.3 + c.userData.phase) * 0.04;   // gentle bob
    }
  }
}

// Level-crossing signals: each lamp head's red lens is one mesh holding both lenses; split it into
// its two halves and flash them alternately, like a real crossing. Blinks day and night.
const CROSSING_PERIOD = 1.0, CROSSING_ON = 3.0, CROSSING_OFF = 0.05;
const crossing = { lamps: [null, null] };
function addCrossingLamps(root) {
  crossing.lamps = [0, 1].map(() => new THREE.MeshStandardMaterial({
    color: 0x7a1a14, emissive: 0xff2a1a, emissiveIntensity: CROSSING_OFF, roughness: 0.4 }));
  const split = new WeakSet();
  root.traverse((post) => {
    if (!/^Crossing_/.test(post.name) || /^Crossing_/.test(post.parent?.name ?? '')) return;
    const meshes = [];
    post.traverse((m) => m.isMesh && meshes.push(m));
    const housing = meshes.find((m) => /^mat23/.test(m.material.name));   // black lamp housings
    if (!housing) return;
    const hy = new THREE.Box3().setFromObject(housing).getCenter(new THREE.Vector3()).y;
    // the red lens sits at the housing's height (the barrier's red stripes are lower)
    const lens = meshes.find((m) => /^mat8/.test(m.material.name) &&
      Math.abs(new THREE.Box3().setFromObject(m).getCenter(new THREE.Vector3()).y - hy) < 0.004);
    if (!lens) return;
    const g = lens.geometry;
    if (!split.has(g)) {
      split.add(g);
      g.computeBoundingBox();
      const bb = g.boundingBox, c = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3());
      const axis = s.x > s.z ? 'x' : 'z';   // the two lenses sit side by side along the longer axis
      const pos = g.attributes.position, idx = g.index ? g.index.array : [...Array(pos.count).keys()];
      const sides = [[], []];
      for (let i = 0; i < idx.length; i += 3) {
        const mid = (pos.getComponent(idx[i], axis === 'x' ? 0 : 2) + pos.getComponent(idx[i + 1], axis === 'x' ? 0 : 2) +
                     pos.getComponent(idx[i + 2], axis === 'x' ? 0 : 2)) / 3;
        sides[mid < c[axis] ? 0 : 1].push(idx[i], idx[i + 1], idx[i + 2]);
      }
      g.setIndex([...sides[0], ...sides[1]]);
      g.clearGroups();
      g.addGroup(0, sides[0].length, 0);
      g.addGroup(sides[0].length, sides[1].length, 1);
    }
    lens.material = crossing.lamps;
  });
}
function updateCrossing(t) {
  if (!crossing.lamps[0]) return;
  const a = (t % CROSSING_PERIOD) < CROSSING_PERIOD / 2;
  crossing.lamps[0].emissiveIntensity = a ? CROSSING_ON : CROSSING_OFF;
  crossing.lamps[1].emissiveIntensity = a ? CROSSING_OFF : CROSSING_ON;
}

// The shop's windows are painted into its 8 x 4 texture atlas. Ray-sampling the shop front showed the
// glass and window interiors use cells 14 (grey glass), 24 (streaked glass), 25 (amber interior) and
// 21 (the cream sign behind the display window); walls, trim and awning use other cells.
// At night, glow warm wherever the shop samples one of those cells.
const SHOP_GLOW = 1.1, SHOP_GLASS_CELLS = [14, 21, 24, 25];
const shopGlow = { value: 0 };
function addShopGlow(root) {
  root.traverse((o) => {
    if (!o.isMesh || !o.material.map || !/citybits/i.test(o.material.name)) return;
    o.material = o.material.clone();
    o.material.onBeforeCompile = (shader) => {
      shader.uniforms.uShopGlow = shopGlow;
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', '#include <common>\nuniform float uShopGlow;')
        .replace('#include <emissivemap_fragment>', /* glsl */ `#include <emissivemap_fragment>
          {
            float cell = floor(clamp(vMapUv.y, 0.0, 0.999) * 4.0) * 8.0 + floor(clamp(vMapUv.x, 0.0, 0.999) * 8.0);
            float glass = 0.0;
            ${SHOP_GLASS_CELLS.map((c) => `glass = max(glass, 1.0 - step(0.5, abs(cell - ${c.toFixed(1)})));`).join('\n            ')}
            totalEmissiveRadiance += vec3(1.0, 0.64, 0.3) * glass * uShopGlow;
          }`);
    };
  });
}

// Performance: the board arrives as ~2,500 separate meshes (every tree, sleeper and post), which
// means ~2,500 draw calls per frame, and as many again for the shadow pass. Everything that never
// moves is baked into world space and merged into one mesh per material, so the GPU gets a few
// hundred calls instead. Left alone: anything animated (tram, cats, flames, smoke), skinned or
// multi-material meshes, meshes with children, and hidden ones, since the page drives those.
// The compressed model stores vertex data as small normalised integers; baking a world transform
// into those would overflow them, so widen every attribute back to floats first.
function toFloat(g) {
  for (const [name, a] of Object.entries(g.attributes)) {
    if (a.array instanceof Float32Array && !a.isInterleavedBufferAttribute) continue;
    const out = new Float32Array(a.count * a.itemSize);
    for (let i = 0; i < a.count; i++) for (let c = 0; c < a.itemSize; c++) out[i * a.itemSize + c] = a.getComponent(i, c);
    g.setAttribute(name, new THREE.BufferAttribute(out, a.itemSize));
  }
  return g;
}
function mergeStatic(root, animations) {
  root.updateMatrixWorld(true);
  const animated = new Set();
  for (const clip of animations) for (const t of clip.tracks) animated.add(THREE.PropertyBinding.parseTrackName(t.name).nodeName);
  const isAnimated = (o) => { for (let p = o; p && p !== root; p = p.parent) if (animated.has(p.name) || !p.visible) return true; return false; };
  const groups = new Map();
  root.traverse((o) => {
    if (!o.isMesh || o.isSkinnedMesh || o.isInstancedMesh || Array.isArray(o.material) || o.children.length) return;
    const g = o.geometry;
    if (Object.keys(g.morphAttributes).length || g.groups.length > 1 || isAnimated(o)) return;
    const flip = o.matrixWorld.determinant() < 0;
    if (flip && !g.index) return;   // mirrored and unindexed: can't fix its winding cheaply, keep it
    const attrs = Object.entries(g.attributes).map(([k, a]) => `${k}${a.itemSize}${a.array.constructor.name}${a.normalized}`).sort().join();
    const key = [o.material.uuid, attrs, !!g.index, o.castShadow, o.receiveShadow].join('|');
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ o, flip });
  });
  const toLocal = root.matrixWorld.clone().invert();
  let merged = 0;
  for (const list of groups.values()) {
    if (list.length < 2) continue;
    const geos = list.map(({ o, flip }) => {
      const g = toFloat(o.geometry.clone()).applyMatrix4(o.matrixWorld);
      if (flip) {   // baking a mirror turns triangles inside out; swap two corners to turn them back
        const ix = g.index.array;
        for (let i = 0; i < ix.length; i += 3) { const t = ix[i + 1]; ix[i + 1] = ix[i + 2]; ix[i + 2] = t; }
      }
      return g;
    });
    const geo = mergeGeometries(geos, false);
    geos.forEach((g) => g.dispose());
    if (!geo) continue;
    const { o: first } = list[0];
    const mesh = new THREE.Mesh(geo, first.material);
    mesh.name = `merged_${first.material.name || 'mat'}`;
    mesh.castShadow = first.castShadow;
    mesh.receiveShadow = first.receiveShadow;
    toLocal.decompose(mesh.position, mesh.quaternion, mesh.scale);   // geometry is in world space
    root.add(mesh);
    for (const { o } of list) o.removeFromParent();
    merged += list.length;
  }
  return merged;
}

// The tram: its windows glow cool white at night, and a soft white light rides along inside it,
// so it also lights its surroundings (and the tunnel walls as it passes through).
const TRAIN_GLOW = 2.0, TRAIN_LIGHT = 0.025;   // just a faint glow around the tram
// The yellow bulb on the tram's nose (above the cab windows) lights up as a warm headlamp: the bulb
// glows, and a soft spot throws a pool of light down the track ahead. Brighter at night.
const HEADLAMP = { mesh: 'group1554354678', color: 0xffc94a, glow: [0.6, 3.0], beam: [0.15, 1.4] };   // [day, night]
const train = { windowMat: null, light: null, lampMat: null, beam: null };
function addTrainLights(root) {
  const tram = root.getObjectByName('Tram');
  if (!tram) return;
  tram.traverse((m) => {
    if (!m.isMesh || m.material.name !== 'mat16') return;   // the tram's window glass
    train.windowMat ??= Object.assign(m.material.clone(), { emissiveIntensity: 0 });
    train.windowMat.emissive.set(0xeaf3ff);
    m.material = train.windowMat;
  });
  tram.updateWorldMatrix(true, true);
  const centre = tram.worldToLocal(new THREE.Box3().setFromObject(tram).getCenter(new THREE.Vector3()));
  train.light = new THREE.PointLight(0xe8f0ff, 0, 0.45, 2);
  train.light.position.copy(centre);
  tram.add(train.light);

  const bulb = tram.getObjectByName(HEADLAMP.mesh);
  if (!bulb) return;
  train.lampMat = bulb.material.clone();
  train.lampMat.emissive.set(HEADLAMP.color);
  bulb.material = train.lampMat;
  bulb.castShadow = false;
  bulb.geometry.computeBoundingBox();
  const at = bulb.geometry.boundingBox.getCenter(new THREE.Vector3()).applyMatrix4(bulb.matrix);   // in tram space
  // the tram runs along its local +x (its POV camera sits at the nose); aim well down, so the
  // wide cone washes the track and ground just ahead of the nose as well as further along
  train.beam = new THREE.SpotLight(HEADLAMP.color, 0, 1.6, THREE.MathUtils.degToRad(40), 0.8, 1.2);
  train.beam.position.copy(at);
  train.beam.target.position.copy(at).add(new THREE.Vector3(1, -0.85, 0));
  tram.add(train.beam, train.beam.target);
}

// A very light, soft shadow floating under the board: a blurred rounded rectangle on a plane
// just below the base, so the diorama reads as hovering over the background.
const BOARD_SHADOW = { opacity: 0.28, drop: 0.5, spread: 1.1 };
function addBoardShadow(root) {
  const terrain = root.getObjectByName('Terrain');
  const b = new THREE.Box3().setFromObject(terrain || root);
  const w = (b.max.x - b.min.x) * BOARD_SHADOW.spread, d = (b.max.z - b.min.z) * BOARD_SHADOW.spread;
  const cv = document.createElement('canvas');
  const blur = 48, cw = 512, ch = Math.round(cw * d / w) + blur * 2;
  cv.width = cw + blur * 2; cv.height = ch;
  const ctx = cv.getContext('2d');
  ctx.filter = `blur(${blur * 0.6}px)`;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.roundRect(blur * 1.4, blur * 1.4, cv.width - blur * 2.8, cv.height - blur * 2.8, blur);
  ctx.fill();
  const tex = new THREE.CanvasTexture(cv);
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(w * cv.width / cw, d * cv.height / (ch - blur * 2)),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: BOARD_SHADOW.opacity, depthWrite: false, toneMapped: false }),
  );
  plane.rotation.x = -Math.PI / 2;
  plane.position.set((b.min.x + b.max.x) / 2, b.min.y - BOARD_SHADOW.drop, (b.min.z + b.max.z) / 2);
  plane.renderOrder = -1;
  scene.add(plane);
}

// Fireflies (night only): glowing points scattered over the board, each hovering a little above the
// terrain under it, drifting in small loops and blinking on its own rhythm. Drawn additively on the
// GPU, sized in world units so they scale with zoom, and hidden behind trees and buildings.
const FIREFLY_COUNT = 220, FIREFLY_SIZE = 0.06, FIREFLY_BRIGHT = 1.8, FIREFLY_HEIGHT = [0.03, 0.2];
// a few more among the trees on the tunnel mountain (a separate mesh from the terrain)
const FIREFLY_CAVE_COUNT = 36;
const fireflies = { points: null, uniforms: { uTime: { value: 0 }, uNight: { value: 0 }, uViewH: { value: 1 } } };
function addFireflies(root) {
  const terrain = root.getObjectByName('Terrain');
  if (!terrain) return;
  terrain.updateWorldMatrix(true, false);
  const tb = new THREE.Box3().setFromObject(terrain);
  let seed = 23;
  const rand = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
  const rc = new THREE.Raycaster(), down = new THREE.Vector3(0, -1, 0);
  const mountain = root.getObjectByName('Mountain_Range');
  const ground = mountain ? [terrain, mountain] : [terrain];
  const pos = [], phase = [], speed = [], blink = [];
  // keep clear of the two truss bridges: a firefly drifting through the girders looks wrong. Each
  // bridge's box grows by the drift loop (0.06 across, 0.025 up/down) plus the glow's own radius.
  const keepOut = [];
  root.traverse((o) => {
    if (/^Truss_Bridge_\d+$/.test(o.name)) keepOut.push(new THREE.Box3().setFromObject(o).expandByVector(new THREE.Vector3(0.1, 0.06, 0.1)));
  });
  // drop a firefly onto whatever ground is under (x, z); onMountain picks which surface it may land on
  const place = (x, z, onMountain) => {
    rc.set(new THREE.Vector3(x, tb.max.y + 2, z), down);
    const hit = rc.intersectObjects(ground, false)[0];
    if (!hit || (hit.object === mountain) !== onMountain) return false;
    const p = new THREE.Vector3(x, hit.point.y + THREE.MathUtils.lerp(FIREFLY_HEIGHT[0], FIREFLY_HEIGHT[1], rand()), z);
    if (keepOut.some((b) => b.containsPoint(p))) return false;
    pos.push(p.x, p.y, p.z);
    phase.push(rand() * Math.PI * 2);
    speed.push(0.4 + rand() * 0.8);    // drift speed
    blink.push(0.9 + rand() * 2.2);    // blink rate
    return true;
  };
  for (let n = 0, tries = 0; n < FIREFLY_COUNT && tries < FIREFLY_COUNT * 6; tries++) {
    const x = THREE.MathUtils.lerp(tb.min.x + 0.1, tb.max.x - 0.1, rand());
    const z = THREE.MathUtils.lerp(tb.min.z + 0.1, tb.max.z - 0.1, rand());
    if (place(x, z, false)) n++;
  }
  const mtnTrees = [];
  root.traverse((o) => { if (o.name.startsWith('MtnTree')) mtnTrees.push(o.getWorldPosition(new THREE.Vector3())); });
  for (let n = 0, tries = 0; mtnTrees.length && n < FIREFLY_CAVE_COUNT && tries < FIREFLY_CAVE_COUNT * 10; tries++) {
    const t = mtnTrees[Math.floor(rand() * mtnTrees.length)];
    if (place(t.x + (rand() - 0.5) * 0.12, t.z + (rand() - 0.5) * 0.12, true)) n++;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aPhase', new THREE.Float32BufferAttribute(phase, 1));
  g.setAttribute('aSpeed', new THREE.Float32BufferAttribute(speed, 1));
  g.setAttribute('aBlink', new THREE.Float32BufferAttribute(blink, 1));
  const m = new THREE.ShaderMaterial({
    uniforms: fireflies.uniforms,
    // add light, and add the same amount of opacity: the canvas is see-through over the sky, so a
    // sprite that wrote full alpha would show its dark square corners against the background

// carry, so Blender bakes that exact colour top-down into a seamless 4 s loop (river.mp4).
// The shader maps the video onto the river by world position and derives the ripple bumps from it.
// RIVER_BOUNDS are the river's Blender world XY bounds printed by the bake (three: x = X, z = -Y).
const RIVER_BOUNDS = { minX: -2.25618, maxX: -0.80692, minY: -1.3, maxY: 1.3 };

const RIVER_LIT = 0.25;

// with the exact values from the .blend, so it moves the surface just as (subtly) as Blender does.
const RIVER_WAVE = { speed: 0.03, height: 0.003, width: 0.12, narrowness: 1.2 };
const riverWaveFrame = { value: 300 };   // start past the first wavefront so the rings are already everywhere

function waveGLSL() {
  const w = RIVER_WAVE;
  return /* glsl */ `
    uniform float uWaveFrame;
    // Blender MOD_wave: gaussian ring, cyclic, displacing along local Z (three's local +Y)
    float blenderWave(vec2 p, float frame) {
      const float w = ${w.width.toFixed(4)}, narrow = ${w.narrowness.toFixed(4)};
      float minfac = 1.0 / exp(w * narrow * w * narrow);
      float a = length(p) - frame * ${w.speed.toFixed(4)};
      float x = a - w, y = 2.0 * w;
      a = (x - y * trunc(x / y)) + w;   // C fmodf, as Blender uses
      if (a <= -w || a >= w) return 0.0;
      a *= narrow;
      return ${w.height.toFixed(4)} * (1.0 / exp(a * a) - minfac);

}
const RIVER_SPEED = 0.5;   // 1 = Blender's real-time flow; lower is calmer

  // low specular: the grey studio reflections were washing the blue out

    roughness: 0.45, metalness: 0, specularIntensity: 0.15, side: THREE.DoubleSide, toneMapped: false });

      .replace('#include <begin_vertex>', /* glsl */ `#include <begin_vertex>
        // glTF local (x, y, z) = Blender local (x, z, -y)
        vWaveP = vec2(position.x, -position.z);

      .replace('#include <project_vertex>', '#include <project_vertex>\nvWaterPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');

      .replace('#include <common>', /* glsl */ `#include <common>

        varying vec2 vWaveP;

        uniform sampler2D uRiver;
        uniform float uRiverBright;
        vec2 riverUv(vec3 p) {

      .replace('#include <color_fragment>', /* glsl */ `#include <color_fragment>

          float up = dot(texture2D(uRiver, ruv + vec2(0.0, px.y)).rgb, vec3(0.333));

}

// Inside the mountain the sky fill and reflections would still light everything evenly, so fade
// ambient light by distance from the tunnel's centreline (the Tunnel_Probe empties from Blender).
// Patching the shared lighting chunk covers every lit material: tube, track, and the train itself.
const TUNNEL_RADIUS = 0.2, TUNNEL_FADE = 0.08, TUNNEL_AMBIENT = 0.06;
function darkenTunnel(root) {
  const pts = [];
  for (let i = 0; ; i++) {
    const p = root.getObjectByName(`Tunnel_Probe_${String(i).padStart(2, '0')}`);
    if (!p) break;
    pts.push(p.getWorldPosition(new THREE.Vector3()));
  }
  if (pts.length < 2) return;
  // pull the ends in a little so darkness ramps up just inside each portal
  const inset = (a, b) => a.clone().lerp(b, Math.min(0.1 / a.distanceTo(b), 0.5));
  pts[0] = inset(pts[0], pts[1]);
  pts[pts.length - 1] = inset(pts[pts.length - 1], pts[pts.length - 2]);
  const list = pts.map((p) => `vec2(${p.x.toFixed(4)}, ${p.z.toFixed(4)})`).join(', ');
  const top = Math.max(...pts.map((p) => p.y)) + TUNNEL_RADIUS;

  THREE.ShaderChunk.lights_fragment_end += /* glsl */ `
  {
    const vec2 tunnelPts[${pts.length}] = vec2[](${list});
    vec3 wp = cameraPosition + transpose(mat3(viewMatrix)) * (-vViewPosition);
    float d = 1e3;
    for (int i = 0; i < ${pts.length - 1}; i++) {
      vec2 a = tunnelPts[i], ab = tunnelPts[i + 1] - a;
      float h = clamp(dot(wp.xz - a, ab) / dot(ab, ab), 0.0, 1.0);
      d = min(d, length(wp.xz - a - ab * h));
    }
    float inside = (1.0 - smoothstep(${TUNNEL_RADIUS.toFixed(3)}, ${(TUNNEL_RADIUS + TUNNEL_FADE).toFixed(3)}, d))
                 * (1.0 - smoothstep(${top.toFixed(3)}, ${(top + 0.05).toFixed(3)}, wp.y));
    float amb = mix(1.0, ${TUNNEL_AMBIENT.toFixed(3)}, inside);
    reflectedLight.indirectDiffuse *= amb;
    reflectedLight.indirectSpecular *= amb;
  }`;

  // the tunnel lamps came through nearly off; give them warm, local pools of light
  root.traverse((o) => {
    if (o.isPointLight && o.name.startsWith('Tunnel_Light')) {
      o.color.set(0xffc27a); o.intensity = 0.16; o.distance = 0.4; o.decay = 2;
    }
  });
}

// sun high over the right-hand end of the board; its shadow frustum is fitted to the board
function addSun(box) {

  const radius = box.getSize(new THREE.Vector3()).length() / 2;
  const sun = new THREE.DirectionalLight(0xfff1dc, 3.2);

const BEACON_RADIUS = 0.017;
function addBeacon(tower) {
  tower.updateWorldMatrix(true, false);
  const p = tower.geometry.attributes.position, v = new THREE.Vector3();
  const pts = [];

  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).applyMatrix4(tower.matrixWorld);
    pts.push(v.clone()); top = Math.max(top, v.y);

  const bulb = new THREE.Mesh(new THREE.SphereGeometry(BEACON_RADIUS, 20, 14), bulbMat);

  const g = c.getContext('2d'), grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,60,40,1)'); grad.addColorStop(0.3, 'rgba(255,0,0,.55)'); grad.addColorStop(1, 'rgba(255,0,0,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);

    // normal blending: additive would turn pink against the blue sky
    map: new THREE.CanvasTexture(c), depthWrite: false, transparent: true, toneMapped: false }));
  halo.scale.setScalar(BEACON_RADIUS * 10);

  const light = new THREE.PointLight(0xff2010, 0, 0.6, 2);   // tints the top of the tower when lit

  const group = new THREE.Group();
  group.position.copy(tip);
  group.add(bulb, halo, light);
  scene.add(group);
  beacon = { bulbMat, halo, light };
}

// one ~0.25s flash every 1.5s, with a quick fade in/out
function updateBeacon(t) {

  const phase = (t % 1.5) / 0.25;
  const k = phase < 1 ? Math.sin(phase * Math.PI) : 0;

      loadingEl.addEventListener('click', lift, { once: true });

  // side compiles the first time the spin turns it into view, and the turntable stalls for a moment.
  // compile() skips hidden things, so briefly show the night-only ones (fireflies etc.) too.

  document.getElementById('paws').style.display = 'none';

    const { look, dist } = gazeAtCab(blackEye);
    if (dist > BLACK_REARM) blackEye.armed = true;
    else if (allowed && blackEye.armed && look > BLACK_LOOK && dist < BLACK_NEAR) {
      blackEye.armed = false;
      blackSound.currentTime = 0;
      blackSound.volume = BLACK_VOLUME;
      blackSound.play().catch(() => {});
    }
  }
  // leaving the cab (or muting / pausing) mid-sound: fade it out rather than cut it
  if (!allowed && !blackSound.paused) {
    blackSound.volume = Math.max(0, blackSound.volume - dt * BLACK_VOLUME / 0.8);
    if (blackSound.volume < 0.002) blackSound.pause();
  }
}

// Level crossings ring as the train comes up to them: from the cab, the bell swells as the train
// nears the closest crossing signal, rings while it passes, and dies away behind it. Day or night.
const CROSSING_VOLUME = 0.08, CROSSING_NEAR = 0.15, CROSSING_FAR = 0.6;
const crossingSound = makeSound('sounds/crossing.mp3');
crossingSound.loop = true;
crossingSound.preload = 'auto';
crossingSound.volume = 0;
const crossingSignals = [];   // world positions of every crossing signal post
function findCrossingSignals(root) {
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (/^Crossing_\d+_Signal_[AB]\d*$/.test(o.name)) crossingSignals.push(o.getWorldPosition(new THREE.Vector3()));
  });
}
function updateCrossingSound(dt) {
  let near = 0;
  if (povCam && crossingSignals.length) {
    const p = povCam.getWorldPosition(_camAt);
    const d = Math.min(...crossingSignals.map((c) => Math.hypot(p.x - c.x, p.z - c.z)));
    near = nearness(d, CROSSING_NEAR, CROSSING_FAR);
  }
  updateNearbySound(crossingSound, CROSSING_VOLUME * near, dt);
}

// Day music: a song loops softly while it's day, fading out as night falls (and back in at dawn).
const DAY_MUSIC_VOLUME = 0.5;
const dayMusic = makeSound('sounds/day.mp3');
dayMusic.loop = true;
dayMusic.preload = 'auto';
dayMusic.volume = 0;
function updateDayMusic() {
  const day = 1 - night;
  const on = musicOn && soundUnlocked && dioramaReady && day > 0.01;
  if (on && dayMusic.paused) dayMusic.play().catch(() => {});
  else if (!on && !dayMusic.paused) dayMusic.pause();
  dayMusic.volume = DAY_MUSIC_VOLUME * day;
}

// Night music: crickets chirp on a loop, and an owl hoots now and then over them, never on the
// cue of the crickets starting: its first call waits a few seconds, then it comes back at random
// gaps. The owl sits well under the crickets. Both fade with the day/night blend; MUSIC mutes them.
const NIGHT_MUSIC = { cricket: 0.25, owl: 0.08 };
const OWL_FIRST = 6, OWL_GAP = [12, 22];   // seconds: first hoot after night falls, then between hoots
const crickets = makeSound('sounds/cricket.mp3');
crickets.loop = true;
crickets.preload = 'auto';
crickets.volume = 0;
const owl = makeSound('sounds/owl.mp3');
owl.preload = 'auto';
let owlWait = OWL_FIRST, owlPrimed = false;
function startNightMusic() {
  if (!musicOn || !dioramaReady) return;
  crickets.play().catch(() => {});
  // Safari only lets a sound play later if it was started once inside a click: start the owl
  // silently here and stop it, so its timed hoots are allowed
  if (!owlPrimed) {
    owlPrimed = true;
    owl.muted = true;
    owl.play().then(() => { owl.pause(); owl.currentTime = 0; owl.muted = false; }, () => { owl.muted = false; owlPrimed = false; });
  }
}
function updateNightMusic(dt) {
  const on = musicOn && soundUnlocked && dioramaReady && night > 0.01;
  if (on && crickets.paused) crickets.play().catch(() => {});
  else if (!on && !crickets.paused) crickets.pause();
  crickets.volume = NIGHT_MUSIC.cricket * night;
  owl.volume = NIGHT_MUSIC.owl * night;
  if (!on) {
    owlWait = OWL_FIRST;   // next nightfall starts the wait again
    if (!owl.paused) owl.pause();
    return;
  }
  owlWait -= dt;
  if (owlWait <= 0) {
    owlWait = THREE.MathUtils.randFloat(OWL_GAP[0], OWL_GAP[1]);
    owl.currentTime = 0;
    owl.play().catch(() => {});
  }
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (mixer && playing) mixer.update(dt);
  if (playing) riverWaveFrame.value += dt * 30 * RIVER_SPEED;   // Blender frames at the scene's 30 fps
  if (mixer) updateFire(mixer.time * 30);
  updateBeacon(clock.elapsedTime);
  updateCrossing(clock.elapsedTime);
  updateMode(dt);
  updateClouds(dt, night);
  updateFireflies(dt);
  updateTrainSound(dt);
  updateBonfireSound(dt);
  updatePurrSound(dt);
  updateBlackCatSound(dt);
  updateCrossingSound(dt);
  updateNightMusic(dt);
  updateDayMusic();
  drawStars(clock.elapsedTime);
  spinHold = Math.max(0, spinHold - dt);
  controls.autoRotate = entered && playing && spinHold === 0;
  if (controls.enabled) controls.update(dt);
  updateFly();
  if (usePov && povCam) updateLookCam(dt);
  renderer.render(scene, fly ? flyCam : usePov && povCam ? lookCam : orbitCam);
});
</script>
</body>
</html>
